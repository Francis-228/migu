<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>咪咕直播 - 短信登录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body { font-family: Arial; max-width: 500px; margin: 30px auto; padding: 0 15px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
    button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 6px; color: white; font-size: 16px; cursor: pointer; }
    .btn-blue { background: #0088ff; }
    .btn-gray { background: #999; }
    #player { margin-top: 20px; border-radius: 8px; overflow: hidden; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<h2>📺 咪咕直播（短信登录）</h2>
<input type="text" id="phone" placeholder="手机号" maxlength="11">
<button class="btn-gray" id="codeBtn" onclick="getSmsCode()">获取验证码</button>
<input type="text" id="smsCode" placeholder="短信验证码" maxlength="6">
<button class="btn-blue" onclick="smsLogin()">登录并播放</button>
<div id="player"></div>

<script>
const proxy = "https://corsproxy.io/?";
let countDown = 0, timer = null;

function setCountDown(){
    countDown = 60;
    const btn = document.getElementById("codeBtn");
    btn.disabled = true;
    timer = setInterval(()=>{
        countDown--;
        btn.innerText = countDown + "秒后重发";
        if(countDown <= 0){
            clearInterval(timer);
            btn.innerText = "获取验证码";
            btn.disabled = false;
        }
    },1000);
}

async function getSmsCode(){
    const phone = document.getElementById("phone").value.trim();
    if(!/^1[3-9]\d{9}$/.test(phone)) return alert("手机号格式错误");
    let res = await fetch(`${proxy}/https://passport.miguvideo.com/sms/send`,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`mobile=${phone}&type=login`
    });
    let data = await res.json();
    if(data.code === 200){
        alert("验证码发送成功");
        setCountDown();
    }else alert("发送失败："+data.msg);
}

async function smsLogin(){
    const phone = document.getElementById("phone").value.trim();
    const code = document.getElementById("smsCode").value.trim();
    if(!phone || !code) return alert("请填写完整信息");

    let res = await fetch(`${proxy}/https://passport.miguvideo.com/login/sms`,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`mobile=${phone}&smsCode=${code}`
    });
    let loginData = await res.json();
    if(loginData.code !== 200) return alert("登录失败："+loginData.msg);
    
    const token = loginData.data.token;
    let playRes = await fetch(`${proxy}/https://live.miguvideo.com/api/play?cid=1001&token=${token}`);
    let playData = await playRes.json();
    
    if(playData.url){
        playVideo(playData.url);
        alert("登录成功，正在播放CCTV1");
    }else alert("获取直播源失败");
}

function playVideo(src){
    const container = document.getElementById("player");
    if(Hls.isSupported()){
        let hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(container);
    }else{
        container.innerHTML = `<video src="${src}" controls style="width:100%;"></video>`;
    }
}
</script>
</body>
</html>
