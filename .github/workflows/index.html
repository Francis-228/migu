<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>咪咕直播-短信登录</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{padding:30px 15px;background:#f5f5f5;}
.box{max-width:480px;margin:0 auto;background:#fff;padding:25px;border-radius:12px;}
h2{text-align:center;margin-bottom:25px;color:#222;}
input{width:100%;height:46px;padding:0 12px;margin:10px 0;border:1px #ddd solid;border-radius:6px;font-size:15px;}
.btn{width:100%;height:46px;border:none;border-radius:6px;font-size:15px;margin:8px 0;cursor:pointer;}
.btn-blue{background:#00a0e8;color:#fff;}
.btn-gray{background:#999;color:#fff;}
#player{margin-top:20px;border-radius:8px;overflow:hidden;}
</style>
<!-- 播放器依赖 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<div class="box">
    <h2>咪咕直播 短信登录</h2>
    <input type="text" id="phone" placeholder="请输入手机号" maxlength="11">
    <input type="text" id="smsCode" placeholder="请输入短信验证码" maxlength="6">
    <button class="btn btn-gray" id="codeBtn" onclick="getSmsCode()">获取验证码</button>
    <button class="btn btn-blue" onclick="smsLogin()">登录并播放</button>
    <div id="player"></div>
</div>

<script>
// 跨域可用中转+咪咕官方鉴权
const host = "https://cors.jerryzou.workers.dev";
let countDown = 0;
let timer = null;

// 倒计时
function setCountDown(){
    countDown = 60;
    const btn = document.getElementById("codeBtn");
    btn.disabled = true;
    timer = setInterval(()=>{
        countDown--;
        btn.innerText = countDown + "秒后重发";
        if(countDown <= 0){
            clearInterval(timer);
            btn.innerText = "获取验证码";
            btn.disabled = false;
        }
    },1000);
}

// 获取短信验证码
async function getSmsCode(){
    const phone = document.getElementById("phone").value.trim();
    if(!/^1[3-9]\d{9}$/.test(phone)){
        return alert("手机号格式错误");
    }
    let res = await fetch(`${host}/https://passport.miguvideo.com/sms/send`,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`mobile=${phone}&type=login`
    });
    let data = await res.json();
    if(data.code === 200){
        alert("验证码发送成功，查收短信");
        setCountDown();
    }else{
        alert("发送失败："+data.msg);
    }
}

// 短信登录 + 获取直播源
async function smsLogin(){
    const phone = document.getElementById("phone").value.trim();
    const code = document.getElementById("smsCode").value.trim();
    if(!phone || !code) return alert("请填写手机号和验证码");

    let res = await fetch(`${host}/https://passport.miguvideo.com/login/sms`,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`mobile=${phone}&smsCode=${code}`
    });
    let loginData = await res.json();
    if(loginData.code !== 200){
        return alert("登录失败："+loginData.msg);
    }
    // 拿token获取CCTV1直播源
    let token = loginData.data.token;
    let playRes = await fetch(`${host}/https://live.miguvideo.com/api/play?cid=1001&token=${token}`);
    let playData = await playRes.json();
    if(playData.url){
        playVideo(playData.url);
        alert("登录成功，正在播放CCTV1");
    }else{
        alert("获取直播源失败");
    }
}

// HLS播放
function playVideo(src){
    const container = document.getElementById("player");
    if(Hls.isSupported()){
        let hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(container);
    }else{
        container.innerHTML = `<video src="${src}" controls style="width:100%;"></video>`;
    }
}
</script>
</body>
</html>
