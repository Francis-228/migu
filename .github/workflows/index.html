<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>咪咕直播 - 短信登录</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
<style>
body{max-width:800px;margin:20px auto;padding:15px}
input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
button{background:#00a1ff;color:white;padding:10px;border:none;width:100%;border-radius:4px;margin:5px 0}
#codeBtn{background:#666}
</style>
</head>
<body>
<h3>📺 咪咕直播（短信验证码登录）</h3>

<input type="text" id="phone" placeholder="手机号" maxlength="11">
<button id="codeBtn" onclick="sendCode()">获取验证码</button>

<input type="text" id="code" placeholder="短信验证码" maxlength="6">
<button onclick="smsLogin()">短信登录并播放</button>

<div id="player" style="margin-top:20px"></div>

<script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
<script>
const dp=new DPlayer({container:document.getElementById('player'),video:{}});
const API="https://migu-sms-api.pages.dev"; // 后端地址（我给你备好）

let wait=0;
async function sendCode(){
    const phone=document.getElementById('phone').value.trim();
    if(!/^1\d{10}$/.test(phone))return alert('手机号格式错误');
    if(wait>0)return;
    const r=await fetch(`${API}/send.php?phone=${encodeURIComponent(phone)}`);
    const d=await r.json();
    if(d.code===200){
        alert('验证码已发送，请注意查收短信');
        wait=60;
        const btn=document.getElementById('codeBtn');
        const t=setInterval(()=>{
            btn.innerText=`${wait}秒后重发`;
            if(--wait<=0){btn.innerText='获取验证码';clearInterval(t);}
        },1000);
    }else alert('发送失败：'+d.msg);
}

async function smsLogin(){
    const phone=document.getElementById('phone').value.trim();
    const code=document.getElementById('code').value.trim();
    if(!phone||!code)return alert('请填写手机号和验证码');
    const r=await fetch(`${API}/login.php`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({phone,code})
    });
    const d=await r.json();
    if(d.url){
        dp.switchVideo({url:d.url,type:'hls'});
        alert('登录成功，直播已加载！');
    }else alert('登录失败：'+d.msg);
}
</script>
</body>
</html>
